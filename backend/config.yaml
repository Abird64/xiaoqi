# 小栖配置（M2-2 要求：改这里就能调，不用改代码）
# 本地覆盖放 config.local.yaml（已 gitignore 不生效时可直接改本文件）

server:
  host: 0.0.0.0          # 手机与电脑需同一 Wi-Fi，只监听局域网
  port: 8000

camera:
  index: 0               # USB 摄像头编号
  width: 640
  height: 480
  fps: 30

vision:                  # MediaPipe Tasks API（D-010：1.x 已移除 mp.solutions）
  model_path: models/pose_landmarker_lite.task   # 相对 backend/；换成 pose_landmarker_full.task 可提升精度
  num_poses: 1           # 只跟踪一个人
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5

posture:
  # 判定阈值：相对校准基准的**增量**（个性化，由 calibration 采样定基线）
  neck_delta_deg: 15.0       # 头前倾角比基准大这么多 → slouch
  hunch_delta_deg: 28.0      # 再大 → desk_hunch
  min_confidence: 0.55       # 低于此置信度 → unknown
  absent_sec: 1.5            # 连续无人这么久 → away
  sample_hz: 10              # 推理降采样：摄像头 30fps，判定 10Hz 足够

debounce:                    # 防抖：候选状态要持续这么久才真正切换（M2-5）
  default_sec: 2.0
  unknown_sec: 1.0
  away_sec: 4.0
  upright_sec: 1.5

refresh_sec: 10              # 同状态重复推送间隔（带 sustained_sec，仍 ≤1 条/秒）

reminder:
  water_sec: 1800            # 30 分钟喝水
  standup_sec: 1800          # 30 分钟久坐起身

phone:
  token: ""                  # 留空 = 启动生成并打印/出二维码
  dedup_window_sec: 60       # 幂等窗口
  stale_sec: 900             # 超过 15 分钟未更新 → stale=true

# 坐姿抽检（2026-11-16：定期拍摄替代实时监测，模型换 Lightweight OpenPose）
# 相关接口：GET /api/sitting/latest · GET /api/sitting/history · POST /api/sitting/check
sitting:
  enabled: true
  interval_sec: 60           # 抽检周期（秒）。方案定的是 1 分钟
  camera_index: 0            # 抽检用的摄像头编号
  lw_repo: ../../lightweight-human-pose-estimation.pytorch   # 相对 backend/
  lw_checkpoint: checkpoints/checkpoint_iter_370000.pth      # 相对 lw_repo
  height_size: 256           # 网络输入高度；抽检不追帧率，可用 320/384 换精度
  torch_threads: 1           # ⚠️ 实测多线程反而更慢（depthwise conv + 宿主争抢），保持 1
  # 粗判阈值（绝对角度，M2 实测后改成相对个人基线的增量）
  head_pitch_deg: 58.0       # 头相对 neck 与竖直夹角 ≥ 此值 → slouch
  torso_lean_deg: 20.0       # 躯干前倾 ≥ 此值 → desk_hunch
  min_visible_kpts: 4        # 少于这么多关键点 → unknown（不硬判）
  margin_ratio: 0.03         # 头部关键点贴边（人出画）→ unknown

storage:
  path: data/xiaoqi.db       # SQLite（相对 backend/）

frontend:
  dist: ../frontend/dist     # `npm run build` 产物，存在则由 FastAPI 托管
